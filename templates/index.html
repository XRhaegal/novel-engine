<!DOCTYPE html>
<html lang="es" class="h-full bg-stone-950 text-stone-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cedar Creek 1985 - Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Space Grotesk', sans-serif; }
    .novel-font { font-family: 'Merriweather', serif; }
  </style>
</head>
<body class="h-full flex flex-col antialiased select-none">

  <!-- Header -->
  <header class="bg-stone-900/90 backdrop-blur border-b border-stone-800 px-4 py-3 flex items-center justify-between z-10 gap-2">
    <div class="flex items-center gap-3">
      <div class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></div>
      <div>
        <h1 class="text-sm font-bold tracking-wider uppercase text-amber-500">Cedar Creek 1985</h1>
        <p id="cache-badge" class="text-[11px] text-stone-400">Context Caching: Pendiente</p>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <select id="model-select" class="bg-stone-800 border border-stone-700 text-stone-200 text-xs rounded-lg px-2.5 py-2 focus:border-amber-500 focus:outline-none">
        <option value="gemini-3.8-flash" selected>Gemini 3.8 Flash</option>
        <option value="gemini-3.7-flash">Gemini 3.7 Flash</option>
      </select>

      <button onclick="toggleConfigModal()" class="p-2 text-stone-400 hover:text-amber-400 text-xs bg-stone-800 rounded-lg border border-stone-700">
        ⚙️ Config
      </button>
      <button onclick="syncCache()" id="btn-sync" class="bg-emerald-700 hover:bg-emerald-600 text-white font-semibold text-xs px-3 py-2 rounded-lg shadow transition">
        ⚡ Sincronizar
      </button>
    </div>
  </header>

  <!-- Feed -->
  <main id="chat-stream" class="flex-1 overflow-y-auto p-4 space-y-4 max-w-4xl mx-auto w-full">
    <div class="bg-stone-900 border border-stone-800 rounded-2xl p-4 text-xs text-stone-400 leading-relaxed">
      <strong class="text-amber-400 block mb-1">Co-Piloto Listo:</strong>
      Cuando termines un capítulo, puedes descargarlo o usar el botón <strong>"⚡ Cerrar y Archivar Capítulo"</strong> para subirlo a GitHub y actualizar la Sección 15 automáticamente.
    </div>
  </main>

  <!-- Input -->
  <footer class="bg-stone-900 border-t border-stone-800 p-3 max-w-4xl mx-auto w-full">
    <div class="flex gap-2 items-end">
      <textarea id="prompt-box" rows="2" placeholder="Escribe el siguiente hito, diálogo o instrucción..." class="flex-1 bg-stone-950 border border-stone-700 rounded-xl p-3 text-sm text-stone-100 placeholder-stone-500 focus:outline-none focus:border-amber-500 resize-none novel-font"></textarea>
      <button onclick="sendTurn()" id="btn-send" class="bg-amber-600 hover:bg-amber-500 text-stone-950 font-bold px-4 py-3 rounded-xl text-sm transition h-[52px] flex items-center justify-center">
        Enviar
      </button>
    </div>
  </footer>

  <!-- Modal Configuración -->
  <div id="modal-config" class="hidden fixed inset-0 bg-black/75 flex items-center justify-center p-4 z-50">
    <div class="bg-stone-900 border border-stone-700 rounded-2xl p-5 max-w-md w-full space-y-3">
      <h3 class="text-sm font-bold text-amber-400 uppercase tracking-wide">Configuración (BYOK)</h3>
      <p class="text-[11px] text-stone-400">Datos guardados únicamente en tu navegador.</p>
      
      <div>
        <label class="block text-xs text-stone-300 mb-1">Google AI Studio API Key:</label>
        <input type="password" id="input-api-key" placeholder="AIzaSy..." class="w-full bg-stone-950 border border-stone-700 rounded-xl p-2.5 text-xs text-stone-100 focus:border-amber-500 font-mono">
      </div>

      <div>
        <label class="block text-xs text-stone-300 mb-1">GitHub Personal Access Token (PAT):</label>
        <input type="password" id="input-gh-token" placeholder="ghp_..." class="w-full bg-stone-950 border border-stone-700 rounded-xl p-2.5 text-xs text-stone-100 focus:border-amber-500 font-mono">
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-xs text-stone-300 mb-1">Usuario GitHub:</label>
          <input type="text" id="input-gh-owner" value="XRhaegal" class="w-full bg-stone-950 border border-stone-700 rounded-xl p-2 text-xs text-stone-100">
        </div>
        <div>
          <label class="block text-xs text-stone-300 mb-1">Repositorio:</label>
          <input type="text" id="input-gh-repo" value="novel-engine" class="w-full bg-stone-950 border border-stone-700 rounded-xl p-2 text-xs text-stone-100">
        </div>
      </div>

      <div class="flex justify-end gap-2 pt-2">
        <button onclick="toggleConfigModal()" class="px-3 py-2 text-xs text-stone-400 hover:text-stone-200">Cerrar</button>
        <button onclick="saveSettings()" class="bg-amber-600 hover:bg-amber-500 text-stone-950 font-bold text-xs px-4 py-2 rounded-xl">Guardar</button>
      </div>
    </div>
  </div>

  <script>
    let savedKey = localStorage.getItem('GEMINI_USER_KEY') || '';
    let ghToken = localStorage.getItem('GH_TOKEN') || '';
    let ghOwner = localStorage.getItem('GH_OWNER') || 'XRhaegal';
    let ghRepo = localStorage.getItem('GH_REPO') || 'novel-engine';

    document.getElementById('input-api-key').value = savedKey;
    document.getElementById('input-gh-token').value = ghToken;
    document.getElementById('input-gh-owner').value = ghOwner;
    document.getElementById('input-gh-repo').value = ghRepo;

    function toggleConfigModal() {
      document.getElementById('modal-config').classList.toggle('hidden');
    }

    function saveSettings() {
      savedKey = document.getElementById('input-api-key').value.trim();
      ghToken = document.getElementById('input-gh-token').value.trim();
      ghOwner = document.getElementById('input-gh-owner').value.trim();
      ghRepo = document.getElementById('input-gh-repo').value.trim();

      localStorage.setItem('GEMINI_USER_KEY', savedKey);
      localStorage.setItem('GH_TOKEN', ghToken);
      localStorage.setItem('GH_OWNER', ghOwner);
      localStorage.setItem('GH_REPO', ghRepo);

      toggleConfigModal();
      alert("Configuración guardada.");
    }

    function getSelectedModel() {
      return document.getElementById('model-select').value;
    }

    async function syncCache() {
      if (!savedKey) {
        toggleConfigModal();
        return alert("Ingresa tu API Key de Gemini.");
      }

      const btn = document.getElementById('btn-sync');
      const badge = document.getElementById('cache-badge');
      const model = getSelectedModel();
      btn.disabled = true;
      btn.innerText = "Sincronizando...";

      try {
        const res = await fetch('/api/sync-cache', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: "sync", api_key: savedKey, model: model })
        });
        const data = await res.json();
        if (res.ok) {
          badge.innerText = `Caché Activa (${data.model}): ${data.total_files} archivos`;
          badge.className = "text-[11px] text-emerald-400 font-semibold";
          alert(data.message);
        } else {
          alert("Error: " + data.detail);
        }
      } catch (err) {
        alert("Error de conexión: " + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = "⚡ Sincronizar";
      }
    }

    async function sendTurn() {
      const box = document.getElementById('prompt-box');
      const text = box.value.trim();
      if (!text) return;
      if (!savedKey) {
        toggleConfigModal();
        return alert("Ingresa tu API Key antes de enviar.");
      }

      appendMessage("Tú", text, "user");
      box.value = "";
      const btn = document.getElementById('btn-send');
      btn.disabled = true;

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text, api_key: savedKey, model: getSelectedModel() })
        });
        const data = await res.json();
        if (res.ok) {
          appendMessage("Cedar Creek AI", data.response, "assistant");
        } else {
          appendMessage("Error", data.detail, "error");
        }
      } catch (err) {
        appendMessage("Error", "Fallo de conexión: " + err.message, "error");
      } finally {
        btn.disabled = false;
      }
    }

    function downloadAsTxt(content) {
      const timestamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, "_");
      const filename = `Cedar_Creek_${timestamp}.txt`;
      const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = filename;
      link.click();
      URL.revokeObjectURL(link.href);
    }

    async function autoArchiveChapter(content) {
      if (!ghToken) {
        toggleConfigModal();
        return alert("Configura tu GitHub Token en ⚙️ Config.");
      }

      const chapterNum = prompt("Número del capítulo que vas a cerrar (ej. 22):", "22");
      if (!chapterNum) return;

      const confirmAction = confirm(`¿Cerrar y archivar automáticamente el Capítulo ${chapterNum} en GitHub y actualizar la Sección 15?`);
      if (!confirmAction) return;

      try {
        const res = await fetch('/api/auto-close-chapter', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            github_token: ghToken,
            repo_owner: ghOwner,
            repo_name: ghRepo,
            chapter_num: chapterNum,
            full_text: content,
            api_key: savedKey,
            model: getSelectedModel()
          })
        });
        const data = await res.json();
        if (res.ok) {
          alert("¡Todo listo!\n" + data.message);
          location.reload();
        } else {
          alert("Error: " + data.detail);
        }
      } catch (err) {
        alert("Fallo de conexión: " + err.message);
      }
    }

    window.generatedResponses = [];

    function appendMessage(sender, text, role) {
      const container = document.getElementById('chat-stream');
      const wrapper = document.createElement('div');
      wrapper.className = role === 'user' 
        ? "bg-stone-900 border border-stone-800 rounded-2xl p-4 ml-6 shadow-sm"
        : "bg-stone-900/50 border border-stone-800/80 rounded-2xl p-4 mr-2 shadow-sm space-y-3";

      let actionsHtml = '';
      if (role === 'assistant') {
        const msgId = window.generatedResponses.length;
        window.generatedResponses.push(text);

        actionsHtml = `
          <div class="pt-2 border-t border-stone-800 flex justify-end gap-2 flex-wrap">
            <button onclick="downloadAsTxt(window.generatedResponses[${msgId}])" class="bg-stone-800 hover:bg-stone-700 text-stone-200 text-xs px-3 py-1.5 rounded-lg border border-stone-700 transition font-sans flex items-center gap-1">
              📥 Descargar .txt
            </button>
            <button onclick="autoArchiveChapter(window.generatedResponses[${msgId}])" class="bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-400 text-xs px-3 py-1.5 rounded-lg border border-emerald-500/40 transition font-sans flex items-center gap-1 font-semibold">
              ⚡ Cerrar y Archivar Capítulo
            </button>
          </div>
        `;
      }

      const roleColor = role === 'user' ? 'text-amber-500' : (role === 'error' ? 'text-rose-400' : 'text-emerald-400');
      wrapper.innerHTML = `
        <div class="text-xs font-bold uppercase tracking-wider ${roleColor} mb-1">${sender}</div>
        <div class="text-sm text-stone-200 novel-font leading-relaxed whitespace-pre-wrap">${text}</div>
        ${actionsHtml}
      `;
      container.appendChild(wrapper);
      container.scrollTop = container.scrollHeight;
    }
  </script>
</body>
</html>
