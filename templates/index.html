<!DOCTYPE html>
<html lang="es" class="h-full bg-stone-950 text-stone-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Cedar Creek 1985</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Space Grotesk', sans-serif; }
    .novel-font { font-family: 'Merriweather', serif; }
    .mono-font { font-family: 'JetBrains Mono', monospace; }
    
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: #292524; border-radius: 2px; }

    @keyframes bounce-delay {
      0%, 80%, 100% { transform: scale(0); opacity: 0.3; }
      40% { transform: scale(1.0); opacity: 1; }
    }
    .typing-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: #d97706;
      animation: bounce-delay 1.4s infinite ease-in-out both;
    }
    .typing-dot:nth-child(1) { animation-delay: -0.32s; }
    .typing-dot:nth-child(2) { animation-delay: -0.16s; }
  </style>
</head>
<body class="h-full flex flex-col bg-stone-950 antialiased overflow-hidden">

  <!-- Header Superior -->
  <header class="bg-stone-900/95 backdrop-blur border-b border-stone-800 px-4 py-2.5 flex items-center justify-between z-30 shrink-0">
    <div class="flex items-center gap-2">
      <div id="status-orb" class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div>
      <span class="text-xs font-bold tracking-widest uppercase text-amber-500">Cedar Creek 1985</span>
      <span id="cache-badge" class="hidden sm:inline-block text-[10px] text-emerald-400 mono-font ml-2">Sincronizado</span>
    </div>

    <!-- Acciones Header -->
    <div class="flex items-center gap-1.5">
      <button onclick="toggleConfigModal()" title="Configuración" class="p-2 text-stone-400 hover:text-amber-400 hover:bg-stone-800 rounded-lg transition text-xs flex items-center justify-center">
        ⚙️
      </button>
      <button onclick="toggleMobileMenu()" title="Menú de herramientas" class="p-2 text-stone-300 hover:text-amber-400 bg-stone-800 rounded-lg transition text-xs flex items-center gap-1 font-semibold">
        <span>Opciones</span> ▾
      </button>
    </div>
  </header>

  <!-- Menú Desplegable Móvil / Herramientas -->
  <div id="tools-menu" class="hidden absolute top-12 right-4 z-40 bg-stone-900 border border-stone-800 rounded-xl p-3 shadow-2xl flex flex-col gap-2.5 w-64">
    <div>
      <label class="block text-[10px] text-stone-400 uppercase tracking-wider mb-1">Modelo de IA</label>
      <select id="model-select" class="w-full bg-stone-950 border border-stone-700 text-stone-200 text-xs rounded-lg px-2.5 py-2 focus:border-amber-500 focus:outline-none">
        <option value="gemini-3.8-flash" selected>Gemini 3.8 Flash</option>
        <option value="gemini-3.7-flash">Gemini 3.7 Flash</option>
        <option value="gemini-3.5-flash-lite">Gemini 3.5 Flash Lite</option>
        <option value="gemini-3.1-pro-preview">Gemini 3.1 Pro</option>
      </select>
    </div>
    <div class="flex gap-2 pt-1 border-t border-stone-800">
      <button onclick="syncCache(); toggleMobileMenu();" class="flex-1 bg-emerald-800 hover:bg-emerald-700 text-stone-100 text-xs py-2 rounded-lg font-semibold transition">
        ⚡ Canon
      </button>
      <button onclick="clearSessionHistory(); toggleMobileMenu();" class="flex-1 bg-stone-800 hover:bg-rose-900/60 text-stone-300 hover:text-rose-200 text-xs py-2 rounded-lg transition">
        🧹 Nueva Sesión
      </button>
    </div>
  </div>

  <!-- Feed Principal de Lectura -->
  <main class="flex-1 flex flex-col h-full bg-stone-950 overflow-hidden relative">
    <div id="chat-stream" class="flex-1 overflow-y-auto px-4 py-5 space-y-5 max-w-2xl mx-auto w-full">
      <div id="welcome-card" class="border border-stone-800/60 bg-stone-900/40 rounded-2xl p-4 text-xs text-stone-400 leading-relaxed text-center">
        <span class="text-amber-500 font-bold block mb-1 tracking-wide">ESTUDIO EDITORIAL ACTIVO</span>
        Escribe con tranquilidad: pulsa <span class="text-stone-300 font-mono text-[11px]">Enter</span> para crear párrafos y el botón para enviar. Usa 📋 para copiar o 🗑️ para descartar turnos.
      </div>
    </div>

    <!-- Barra de Escritura Inferior -->
    <footer class="bg-stone-900/95 backdrop-blur border-t border-stone-800 px-3 py-2.5 shrink-0 safe-bottom">
      <div class="max-w-2xl mx-auto flex gap-2 items-end">
        <textarea id="prompt-box" rows="2" placeholder="Escribe tu acción o diálogo (Enter para nuevo párrafo)..." class="flex-1 bg-stone-950 border border-stone-700/80 rounded-xl p-2.5 text-sm text-stone-100 placeholder-stone-500 focus:outline-none focus:border-amber-500 resize-none novel-font leading-relaxed"></textarea>
        <button onclick="sendTurn()" id="btn-send" class="bg-amber-600 hover:bg-amber-500 text-stone-950 font-bold px-3.5 py-3 rounded-xl text-xs uppercase tracking-wider transition h-[48px] flex items-center justify-center shrink-0">
          <span id="send-label">Enviar</span>
          <span id="send-spinner" class="hidden animate-spin text-base">⏳</span>
        </button>
      </div>
    </footer>
  </main>

  <!-- Notificaciones Flotantes -->
  <div id="toast" class="fixed bottom-20 left-4 right-4 max-w-xs mx-auto bg-stone-900 border border-emerald-500/50 text-stone-200 text-xs px-3.5 py-2.5 rounded-xl shadow-2xl transition-all duration-300 opacity-0 translate-y-4 pointer-events-none z-50 text-center">
    <span id="toast-text">Notificación</span>
  </div>

  <!-- Modal Configuración -->
  <div id="modal-config" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="bg-stone-900 border border-stone-700 rounded-2xl p-5 max-w-sm w-full space-y-3">
      <h3 class="text-xs font-bold text-amber-400 uppercase tracking-wide">Configuración</h3>
      
      <div>
        <label class="block text-[11px] text-stone-300 mb-1">Google AI Studio API Key:</label>
        <input type="password" id="input-api-key" placeholder="AIzaSy..." class="w-full bg-stone-950 border border-stone-700 rounded-xl p-2 text-xs text-stone-100 focus:border-amber-500 font-mono">
      </div>

      <div>
        <label class="block text-[11px] text-stone-300 mb-1">GitHub Token (PAT):</label>
        <input type="password" id="input-gh-token" placeholder="ghp_..." class="w-full bg-stone-950 border border-stone-700 rounded-xl p-2 text-xs text-stone-100 focus:border-amber-500 font-mono">
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-[11px] text-stone-300 mb-1">Usuario:</label>
          <input type="text" id="input-gh-owner" value="XRhaegal" class="w-full bg-stone-950 border border-stone-700 rounded-xl p-2 text-xs text-stone-100">
        </div>
        <div>
          <label class="block text-[11px] text-stone-300 mb-1">Repo:</label>
          <input type="text" id="input-gh-repo" value="novel-engine" class="w-full bg-stone-950 border border-stone-700 rounded-xl p-2 text-xs text-stone-100">
        </div>
      </div>

      <div class="flex justify-end gap-2 pt-2">
        <button onclick="toggleConfigModal()" class="px-3 py-1.5 text-xs text-stone-400 hover:text-stone-200">Cerrar</button>
        <button onclick="saveSettings()" class="bg-amber-600 hover:bg-amber-500 text-stone-950 font-bold text-xs px-3.5 py-1.5 rounded-xl">Guardar</button>
      </div>
    </div>
  </div>

  <script>
    let savedKey = localStorage.getItem('GEMINI_USER_KEY') || '';
    let ghToken = localStorage.getItem('GH_TOKEN') || '';
    let ghOwner = localStorage.getItem('GH_OWNER') || 'XRhaegal';
    let ghRepo = localStorage.getItem('GH_REPO') || 'novel-engine';

    document.getElementById('input-api-key').value = savedKey;
    document.getElementById('input-gh-token').value = ghToken;
    document.getElementById('input-gh-owner').value = ghOwner;
    document.getElementById('input-gh-repo').value = ghRepo;

    let sessionHistory = [];

    async function loadRemoteSession() {
      try {
        const res = await fetch('/api/session');
        if (res.ok) {
          const data = await res.json();
          if (data.history && data.history.length > 0) {
            sessionHistory = data.history;
            renderAllHistory();
            return;
          }
        }
      } catch (e) {}

      const local = localStorage.getItem('CC_SESSION_HISTORY');
      if (local) {
        try {
          sessionHistory = JSON.parse(local);
          renderAllHistory();
        } catch(e) {}
      }
    }

    function renderAllHistory() {
      const stream = document.getElementById('chat-stream');
      stream.innerHTML = '';
      if (sessionHistory.length === 0) {
        stream.innerHTML = `
          <div id="welcome-card" class="border border-stone-800/60 bg-stone-900/40 rounded-2xl p-4 text-xs text-stone-400 leading-relaxed text-center">
            <span class="text-amber-500 font-bold block mb-1 tracking-wide">ESTUDIO EDITORIAL ACTIVO</span>
            Escribe con tranquilidad: pulsa <span class="text-stone-300 font-mono text-[11px]">Enter</span> para crear párrafos y el botón para enviar. Usa 📋 para copiar o 🗑️ para descartar turnos.
          </div>
        `;
        return;
      }
      sessionHistory.forEach((item, idx) => renderMessageDom(item.sender, item.text, item.role, idx, false));
      stream.scrollTop = stream.scrollHeight;
    }

    async function syncSessionToServer() {
      localStorage.setItem('CC_SESSION_HISTORY', JSON.stringify(sessionHistory));
      try {
        await fetch('/api/session', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ history: sessionHistory })
        });
      } catch (e) {}
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadRemoteSession();

      // Atajo: Ctrl+Enter o Cmd+Enter para enviar rápido en PC si quieres, Enter normal solo salta línea
      const pBox = document.getElementById('prompt-box');
      pBox.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
          e.preventDefault();
          sendTurn();
        }
      });
    });

    function toggleMobileMenu() {
      document.getElementById('tools-menu').classList.toggle('hidden');
    }

    function toggleConfigModal() {
      document.getElementById('modal-config').classList.toggle('hidden');
    }

    async function clearSessionHistory() {
      if (!confirm("¿Deseas vaciar la pantalla para iniciar un nuevo capítulo?")) return;
      sessionHistory = [];
      localStorage.removeItem('CC_SESSION_HISTORY');
      try { await fetch('/api/session', { method: 'DELETE' }); } catch(e) {}
      renderAllHistory();
      showToast("Sesión vaciada.");
    }

    function showToast(text, isError = false) {
      const toast = document.getElementById('toast');
      const toastText = document.getElementById('toast-text');
      toastText.innerText = text;
      toast.className = isError 
        ? "fixed bottom-20 left-4 right-4 max-w-xs mx-auto bg-stone-900 border border-rose-500 text-stone-200 text-xs px-3.5 py-2.5 rounded-xl shadow-2xl transition-all duration-300 opacity-100 z-50 text-center"
        : "fixed bottom-20 left-4 right-4 max-w-xs mx-auto bg-stone-900 border border-emerald-500 text-stone-200 text-xs px-3.5 py-2.5 rounded-xl shadow-2xl transition-all duration-300 opacity-100 z-50 text-center";

      setTimeout(() => {
        toast.className = toast.className.replace('opacity-100', 'opacity-0 pointer-events-none');
      }, 3500);
    }

    function saveSettings() {
      savedKey = document.getElementById('input-api-key').value.trim();
      ghToken = document.getElementById('input-gh-token').value.trim();
      ghOwner = document.getElementById('input-gh-owner').value.trim();
      ghRepo = document.getElementById('input-gh-repo').value.trim();

      localStorage.setItem('GEMINI_USER_KEY', savedKey);
      localStorage.setItem('GH_TOKEN', ghToken);
      localStorage.setItem('GH_OWNER', ghOwner);
      localStorage.setItem('GH_REPO', ghRepo);

      toggleConfigModal();
      showToast("Configuración guardada.");
    }

    function getSelectedModel() {
      return document.getElementById('model-select').value;
    }

    async function syncCache() {
      if (!savedKey) {
        toggleConfigModal();
        return showToast("Ingresa tu API Key de Gemini primero.", true);
      }

      showToast("Verificando canon en Render...");
      try {
        const res = await fetch('/api/sync-cache', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: "sync", api_key: savedKey, model: getSelectedModel() })
        });
        const data = await res.json();
        if (res.ok) {
          showToast(data.message);
        } else {
          showToast("Error: " + data.detail, true);
        }
      } catch (err) {
        showToast("Error de conexión: " + err.message, true);
      }
    }

    function showThinkingIndicator() {
      const container = document.getElementById('chat-stream');
      const bubble = document.createElement('div');
      bubble.id = 'thinking-bubble';
      bubble.className = "bg-stone-900/40 border border-stone-800/80 rounded-2xl p-3.5 flex items-center gap-2.5";
      bubble.innerHTML = `
        <span class="text-[10px] font-bold uppercase tracking-wider text-amber-500">Cedar Creek AI</span>
        <div class="flex items-center gap-1">
          <span class="typing-dot"></span>
          <span class="typing-dot"></span>
          <span class="typing-dot"></span>
        </div>
        <span class="text-xs text-stone-500 novel-font italic">redactando...</span>
      `;
      container.appendChild(bubble);
      container.scrollTop = container.scrollHeight;
    }

    function removeThinkingIndicator() {
      const bubble = document.getElementById('thinking-bubble');
      if (bubble) bubble.remove();
    }

    async function sendTurn() {
      const box = document.getElementById('prompt-box');
      const text = box.value.trim();
      if (!text) return;
      if (!savedKey) {
        toggleConfigModal();
        return showToast("Ingresa tu API Key antes de enviar.", true);
      }

      appendMessage("Tú", text, "user");
      box.value = "";
      
      const btn = document.getElementById('btn-send');
      const label = document.getElementById('send-label');
      const spinner = document.getElementById('send-spinner');
      btn.disabled = true;
      label.classList.add('hidden');
      spinner.classList.remove('hidden');

      showThinkingIndicator();

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text, api_key: savedKey, model: getSelectedModel() })
        });
        const data = await res.json();
        removeThinkingIndicator();

        if (res.ok) {
          appendMessage("Cedar Creek AI", data.response, "assistant");
        } else {
          appendMessage("Error", data.detail || "Fallo en el servidor.", "error");
        }
      } catch (err) {
        removeThinkingIndicator();
        appendMessage("Error", "Fallo de conexión: " + err.message, "error");
      } finally {
        btn.disabled = false;
        label.classList.remove('hidden');
        spinner.classList.add('hidden');
      }
    }

    function appendMessage(sender, text, role) {
      sessionHistory.push({ sender, text, role, time: Date.now() });
      syncSessionToServer();
      const idx = sessionHistory.length - 1;
      renderMessageDom(sender, text, role, idx, true);
    }

    function copyMessage(idx) {
      if (sessionHistory[idx]) {
        navigator.clipboard.writeText(sessionHistory[idx].text).then(() => {
          showToast("Mensaje copiado al portapapeles 📋");
        }).catch(() => {
          showToast("No se pudo copiar", true);
        });
      }
    }

    function deleteMessage(idx) {
      if (!confirm("¿Eliminar este mensaje del historial?")) return;
      sessionHistory.splice(idx, 1);
      syncSessionToServer();
      renderAllHistory();
      showToast("Mensaje eliminado 🗑️");
    }

    function renderMessageDom(sender, text, role, idx, scroll = true) {
      const welcome = document.getElementById('welcome-card');
      if (welcome) welcome.classList.add('hidden');

      const container = document.getElementById('chat-stream');
      const wrapper = document.createElement('div');
      
      if (role === 'user') {
        wrapper.className = "bg-stone-900/80 border border-stone-800 rounded-2xl p-3.5 ml-4 shadow-sm relative group";
      } else if (role === 'assistant') {
        wrapper.className = "bg-stone-900/40 border border-stone-800/60 rounded-2xl p-4 shadow-sm space-y-2.5 relative group";
      } else {
        wrapper.className = "bg-rose-950/20 border border-rose-900/50 rounded-2xl p-3 shadow-sm text-rose-300 text-xs relative group";
      }

      let actionsHtml = '';
      const isChapterClosing = text.includes("CONTINUITY STATE") || text.includes("FIN DEL CAPÍTULO") || text.includes("═ CONTINUITY");

      if (role === 'assistant' && isChapterClosing) {
        actionsHtml = `
          <div class="pt-2.5 mt-2 border-t border-stone-800 flex justify-end gap-2 flex-wrap">
            <button onclick="downloadCompleteSession()" class="bg-stone-800 hover:bg-stone-700 text-stone-200 text-xs px-2.5 py-1.5 rounded-lg border border-stone-700 transition font-sans">
              📥 Descargar .txt
            </button>
            <button onclick="autoArchiveChapter(getLatestAssistantBlock())" class="bg-emerald-600/20 text-emerald-400 text-xs px-2.5 py-1.5 rounded-lg border border-emerald-500/40 transition font-sans font-semibold">
              ⚡ Archivar en GitHub
            </button>
          </div>
        `;
      }

      const roleColor = role === 'user' ? 'text-amber-500' : (role === 'error' ? 'text-rose-400' : 'text-amber-400/90');
      
      wrapper.innerHTML = `
        <div class="flex items-center justify-between mb-1">
          <span class="text-[10px] font-bold uppercase tracking-wider ${roleColor}">${sender}</span>
          <div class="flex items-center gap-1 opacity-70 hover:opacity-100 transition">
            <button onclick="copyMessage(${idx})" title="Copiar texto" class="p-1 text-stone-400 hover:text-stone-200 rounded text-xs">
              📋
            </button>
            <button onclick="deleteMessage(${idx})" title="Borrar este mensaje" class="p-1 text-stone-400 hover:text-rose-400 rounded text-xs">
              🗑️
            </button>
          </div>
        </div>
        <div class="text-[14px] text-stone-200 novel-font leading-relaxed whitespace-pre-wrap">${text}</div>
        ${actionsHtml}
      `;
      container.appendChild(wrapper);
      if (scroll) container.scrollTop = container.scrollHeight;
    }

    function getLatestAssistantBlock() {
      for (let i = sessionHistory.length - 1; i >= 0; i--) {
        if (sessionHistory[i].role === 'assistant') {
          return sessionHistory[i].text;
        }
      }
      return "";
    }

    function downloadCompleteSession() {
      const fullProse = sessionHistory
        .filter(m => m.role === 'assistant')
        .map(m => m.text)
        .join("\n\n---\n\n");
      const timestamp = new Date().toISOString().slice(0, 10);
      const filename = `Cedar_Creek_Capitulo_${timestamp}.txt`;
      const blob = new Blob([fullProse], { type: 'text/plain;charset=utf-8' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = filename;
      link.click();
      URL.revokeObjectURL(link.href);
    }

    async function autoArchiveChapter(content) {
      if (!ghToken) {
        toggleConfigModal();
        return showToast("Configura tu GitHub Token en ⚙ Config.", true);
      }

      const chapterNum = prompt("Número del capítulo a archivar:", "26");
      if (!chapterNum) return;

      if (!confirm(`¿Archivar Capítulo ${chapterNum} en GitHub y actualizar Continuidad?`)) return;

      try {
        const res = await fetch('/api/auto-close-chapter', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            github_token: ghToken,
            repo_owner: ghOwner,
            repo_name: ghRepo,
            chapter_num: chapterNum,
            full_text: content,
            api_key: savedKey,
            model: getSelectedModel()
          })
        });
        const data = await res.json();
        if (res.ok) {
          showToast("¡Archivado con éxito!");
          setTimeout(() => location.reload(), 1500);
        } else {
          showToast("Error: " + data.detail, true);
        }
      } catch (err) {
        showToast("Fallo de conexión: " + err.message, true);
      }
    }
  </script>
</body>
</html>
